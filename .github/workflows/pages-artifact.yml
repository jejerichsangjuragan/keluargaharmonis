name: Publish GitHub Pages artifact

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-artifact
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build GitHub Pages bundle
        run: GITHUB_PAGES=true pnpm run build:pages

      - name: Prepare cache-busted root artifact
        run: node scripts/prepare-pages-artifact.mjs "${GITHUB_SHA}"

      - name: Commit and push artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html assets gh-pages-assets
          if git diff --cached --quiet; then
            echo "No artifact changes to publish."
          else
            git commit -m "chore: publish Pages artifact ${GITHUB_SHA::7} [skip ci]"
            git push origin HEAD:main
          fi
